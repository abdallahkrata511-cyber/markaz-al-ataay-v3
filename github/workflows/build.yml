name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "$(ls *.zip | head -n 1)" -d project
          cd project
          if [ ! -f package.json ]; then cd "$(ls -d */ | head -n 1)"; fi
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps

      - name: Type check (لا يوقف البناء)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: npm run lint

      - name: Accounting tests (لا يوقف البناء)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: npm run test:accounting

      - name: Build web
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alataya-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
